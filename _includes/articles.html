<section id="articles">
{% for slug in page.links %}
    {% for post in site.posts %}
        {% if post.slug == slug %}
    <article>
        <a href="{{ post.url }}">
            <img width="190" height="190" src="/{{ post.small_image }}" alt="{{ post.lead | escape }}">
        </a>
        <div class="article-copy">
            <header>
                <h1><a href="{{ post.url }}">{{ post.lead }}</a></h1>
            </header>
            <p><a href="{{ post.url }}">{{ post.description }}</a></p>
            {% if post.time && post.price %}
            <p class="price">{{post.time}} / {{post.price}} &euro;</p>
            {% endif %}
            {% if post.layout == 'article' %}
            <iframe src="//www.facebook.com/plugins/like.php?href={{ site.url | replace:':','%3A' | replace:'/','%2F' }}{{ post.url | replace:'/','%2F' }}&amp;send=false&amp;layout=button_count&amp;width=82&amp;show_faces=true&amp;font&amp;colorscheme=light&amp;action=like&amp;height=21" scrolling="no" frameborder="0" width="92" height="21" style="border:none; overflow:hidden;" allowTransparency="true" title="J’aime sur Facebook" loading="lazy">
            </iframe>
            {% endif %}
        </div>
     </article>
        {% endif %}
    {% endfor %}
{% endfor %}
</section>
